# Loki values — single-binary mode with filesystem storage, sized for kind.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Zero out the scalable-mode workloads
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# We don't ship Loki rules via the sidecar
sidecar:
  rules:
    enabled: false

# No gateway/canary/caches/minio on a local dev cluster
gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
test:
  enabled: false
