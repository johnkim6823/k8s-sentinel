apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-agent-read
subjects:
  - kind: ServiceAccount
    name: sentinel-agent
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agent
  namespace: default
  labels:
    app: sentinel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-agent
  template:
    metadata:
      labels:
        app: sentinel-agent
    spec:
      serviceAccountName: sentinel-agent
      containers:
        - name: sentinel-agent
          image: sentinel-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"
            - name: LOKI_URL
              value: "http://loki.monitoring:3100"
            # Diagnosis engine (Week 4). Provide the key via a secret created
            # out-of-band — never commit it:
            #   kubectl create secret generic sentinel-agent-secrets \
            #     --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
            # Without the secret the agent runs with diagnosis skipped.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-agent-secrets
                  key: anthropic-api-key
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-agent
  namespace: default
  labels:
    app: sentinel-agent
spec:
  selector:
    app: sentinel-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
