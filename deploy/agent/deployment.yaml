apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-agent
rules:
  # read: context collection
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  # write: whitelisted remediations (restart via patch, scale, rollback)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-agent
subjects:
  - kind: ServiceAccount
    name: sentinel-agent
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agent
  namespace: default
  labels:
    app: sentinel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-agent
  template:
    metadata:
      labels:
        app: sentinel-agent
    spec:
      serviceAccountName: sentinel-agent
      volumes:
        # emptyDir: history survives container restarts but not pod rescheduling.
        # Swap for a PersistentVolumeClaim to persist across pod recreation.
        - name: history
          emptyDir: {}
      containers:
        - name: sentinel-agent
          image: sentinel-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"
            - name: LOKI_URL
              value: "http://loki.monitoring:3100"
            # Diagnosis engine (Week 4). Provide the key via a secret created
            # out-of-band — never commit it:
            #   kubectl create secret generic sentinel-agent-secrets \
            #     --from-literal=anthropic-api-key="$ANTHROPIC_API_KEY"
            # Without the secret the agent runs with diagnosis skipped.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-agent-secrets
                  key: anthropic-api-key
                  optional: true
            # Slack reporter (Week 5). Same optional secret pattern.
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: sentinel-agent-secrets
                  key: slack-webhook-url
                  optional: true
            # Approval gate: default requires manual POST /approve. Set to "1"
            # to auto-approve safe remediations (demo/experiment only).
            - name: AUTO_APPROVE
              value: "0"
            - name: SENTINEL_DB
              value: "/data/sentinel.db"
          volumeMounts:
            - name: history
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-agent
  namespace: default
  labels:
    app: sentinel-agent
spec:
  selector:
    app: sentinel-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
