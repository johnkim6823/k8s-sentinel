name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app-a
            context: deploy/sample-apps/app-a
          - name: app-b
            context: deploy/sample-apps/app-b
          - name: sentinel-agent
            context: agent
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.name }}:ci ${{ matrix.context }}
