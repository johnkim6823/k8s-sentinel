name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [app-a, app-b]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ${{ matrix.app }}:ci deploy/sample-apps/${{ matrix.app }}
